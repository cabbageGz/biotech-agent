<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Biotech Agent Console</title>
    <link rel="stylesheet" href="/app.css" />
  </head>
  <body>
    <div class="shell">
      <aside class="sidebar">
        <div class="brand">
          <div class="brand-mark">BA</div>
          <div>
            <h1>Biotech Agent</h1>
            <p>行业情报控制台</p>
          </div>
        </div>
        <div class="sidebar-actions">
          <button id="clearRuns" class="secondary" type="button">删除任务记录</button>
          <a id="adminLink" class="secondary nav-link" href="/admin.html" hidden>用户管理</a>
          <button id="logout" class="secondary" type="button">退出登录</button>
        </div>
        <div class="sidebar-title">运行记录</div>
        <div id="runList" class="run-list"></div>
      </aside>

      <main class="workspace">
        <section class="topbar">
          <div>
            <p class="eyebrow">CEO -> Research -> Content</p>
            <h2>生物医药热点</h2>
          </div>
          <div id="statusPill" class="status-pill">Ready</div>
        </section>

        <section class="composer setup-panel">
          <div class="panel-title">
            <div>
              <strong>生成设置</strong>
              <p>先定义选题和内容风格，再抓取新闻生成多条发布文案。</p>
            </div>
            <button id="runFlow" class="primary" type="button">获取新闻并生成</button>
          </div>
          <div class="field-grid">
            <label for="topicInput">
              <span>今日选题提示</span>
              <textarea
                id="topicInput"
                class="wide-textarea"
                rows="3"
                placeholder="可选：ADC、AI 制药、出海授权、肿瘤临床进展"
              ></textarea>
            </label>
            <label for="contentInstruction">
              <span>内容要求</span>
              <textarea
                id="contentInstruction"
                class="wide-textarea"
                rows="3"
                placeholder="可选：偏科普、偏投融资、每条加一句小科普、避免英文缩写等"
              ></textarea>
            </label>
            <label class="wide-field" for="formatReference">
              <span>格式参考</span>
              <textarea
                id="formatReference"
                class="wide-textarea"
                rows="4"
                placeholder="可选：定义每条文案格式。例如：标题：...；开头：...；正文分三段：一句话/为什么重要/小科普；结尾：..."
              ></textarea>
            </label>
          </div>
          <div class="settings-row">
            <label>新闻数 <input id="maxItems" type="number" min="5" max="60" value="24" /></label>
            <label>热点数 <input id="maxHotspots" type="number" min="3" max="10" value="6" /></label>
            <label>内容字数 <input id="contentWords" type="number" min="200" max="2000" value="700" /></label>
          </div>
        </section>

        <section class="cards">
          <div class="metric">
            <span>抓取新闻</span>
            <strong id="totalItems">-</strong>
          </div>
          <div class="metric">
            <span>热点条目</span>
            <strong id="hotspotCount">-</strong>
          </div>
          <div class="metric">
            <span>运行编号</span>
            <strong id="runId">-</strong>
          </div>
        </section>

        <section class="tabs">
          <button class="tab active" data-tab="post" type="button">发布文案</button>
          <button class="tab" data-tab="hotspots" type="button">热点卡片</button>
          <button class="tab" data-tab="cover" type="button">封面图</button>
          <button class="tab" data-tab="research" type="button">研究摘要</button>
          <button class="tab" data-tab="brief" type="button">CEO Brief</button>
          <button class="tab" data-tab="json" type="button">JSON</button>
        </section>

        <section class="output">
          <div id="coverActions" class="cover-actions" hidden>
            <div class="cover-action-top">
              <span>每条正文可单独生成一张配图</span>
              <label>
                图片尺寸
                <select id="imageSize">
                  <option value="1024*1024">1:1 方图</option>
                  <option value="768*1024">3:4 竖图</option>
                  <option value="1024*768">4:3 横图</option>
                  <option value="720*1280">9:16 竖屏</option>
                  <option value="1280*720">16:9 横屏</option>
                </select>
              </label>
            </div>
            <textarea
              id="imageInstruction"
              class="wide-textarea"
              rows="2"
              placeholder="可选：图片风格要求，例如清爽白底、研报风、少文字、只保留标题和标签、突出机制示意等"
            ></textarea>
          </div>
          <div id="hotspotView" class="hotspot-view" hidden></div>
          <div id="coverView" class="cover-view" hidden></div>
          <pre id="outputView">点击“获取新闻并生成”开始第一轮内容生产。</pre>
        </section>
      </main>
    </div>
    <div id="toast" class="toast"></div>
    <script src="/app.js"></script>
  </body>
</html>
