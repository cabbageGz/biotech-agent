<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Biotech Agent Console</title>
    <link rel="stylesheet" href="/app.css" />
  </head>
  <body>
    <div class="shell">
      <aside class="sidebar">
        <div class="brand">
          <div class="brand-mark">BA</div>
          <div>
            <h1>Biotech Agent</h1>
            <p>行业情报控制台</p>
          </div>
        </div>
        <div class="sidebar-actions">
          <button id="clearRuns" class="secondary" type="button">删除任务记录</button>
          <a id="adminLink" class="secondary nav-link" href="/admin.html" hidden>用户管理</a>
          <button id="togglePassword" class="secondary" type="button">修改密码</button>
          <div id="passwordPanel" class="password-panel" hidden>
            <input id="currentPassword" type="password" placeholder="当前密码" />
            <input id="newPassword" type="password" placeholder="新密码，至少 6 位" />
            <button id="changePassword" class="primary" type="button">保存新密码</button>
            <p id="passwordMessage" class="form-message"></p>
          </div>
          <button id="logout" class="secondary" type="button">退出登录</button>
        </div>
        <div class="sidebar-title">运行记录</div>
        <div id="runList" class="run-list"></div>
      </aside>

      <main class="workspace">
        <section class="topbar">
          <div>
            <p class="eyebrow">CEO -> Research -> Content</p>
            <h2>生物医药热点</h2>
          </div>
          <div id="statusPill" class="status-pill">Ready</div>
        </section>

        <section class="composer setup-panel">
          <div class="panel-title">
            <div>
              <strong>生成设置</strong>
              <p>先定义选题和抓取范围，再聚类排序；文案要求在热点卡片中设置。</p>
            </div>
            <button id="runFlow" class="primary" type="button">获取新闻并排序</button>
          </div>
          <div class="field-grid">
            <label class="wide-field" for="topicInput">
              <span>今日选题提示</span>
              <textarea
                id="topicInput"
                class="wide-textarea"
                rows="3"
                placeholder="可选：ADC、AI 制药、出海授权、肿瘤临床进展"
              ></textarea>
            </label>
          </div>
          <div class="settings-row">
            <label>新闻抓取上限 <input id="maxItems" type="number" min="5" max="60" value="24" /></label>
            <label>候选主题上限 <input id="maxHotspots" type="number" min="3" max="10" value="6" /></label>
          </div>
        </section>

        <section class="cards">
          <div class="metric">
            <span>新闻条目</span>
            <strong id="totalItems">-</strong>
          </div>
          <div class="metric">
            <span>候选主题</span>
            <strong id="hotspotCount">-</strong>
          </div>
          <div class="metric">
            <span>运行编号</span>
            <strong id="runId">-</strong>
          </div>
        </section>

        <section class="tabs">
          <button class="tab active" data-tab="post" type="button">发布文案</button>
          <button class="tab" data-tab="hotspots" type="button">热点卡片</button>
          <button class="tab" data-tab="news" type="button">新闻清单</button>
          <button class="tab" data-tab="cover" type="button">封面图</button>
          <button class="tab" data-tab="publish" type="button">发布预览</button>
          <button class="tab" data-tab="research" type="button">研究摘要</button>
        </section>

        <section class="output">
          <div id="coverActions" class="cover-actions" hidden>
            <div class="cover-action-top">
              <span>每条正文可单独生成一张配图</span>
              <label>
                图片尺寸
                <select id="imageSize">
                  <option value="1024*1024">1:1 方图</option>
                  <option value="768*1024">3:4 竖图</option>
                  <option value="1024*768">4:3 横图</option>
                  <option value="720*1280">9:16 竖屏</option>
                  <option value="1280*720">16:9 横屏</option>
                </select>
              </label>
            </div>
          </div>
          <div id="writingSettings" class="writing-settings" hidden>
            <div class="panel-title compact-title">
              <div>
                <strong>文案生成设置</strong>
                <p>选择热点后，DeepSeek 会参考这里的要求生成发布文案。</p>
              </div>
              <label>
                正文字数
                <input id="contentWords" type="number" min="200" max="2000" value="700" />
              </label>
            </div>
            <div class="field-grid">
              <label for="contentInstruction">
                <span>内容要求</span>
                <textarea
                  id="contentInstruction"
                  class="wide-textarea"
                  rows="3"
                  placeholder="可选：偏科普、偏投融资、每条加一句小科普、避免英文缩写等"
                ></textarea>
              </label>
              <label for="formatReference">
                <span>格式参考</span>
                <textarea
                  id="formatReference"
                  class="wide-textarea"
                  rows="3"
                  placeholder="可选：定义每条文案格式，例如一句话/为什么重要/小科普/结尾提醒"
                ></textarea>
              </label>
            </div>
          </div>
          <div id="hotspotView" class="hotspot-view" hidden></div>
          <div id="newsView" class="news-view" hidden></div>
          <div id="publishView" class="publish-view" hidden></div>
          <div id="coverView" class="cover-view" hidden></div>
          <pre id="outputView">点击“获取新闻并排序”开始第一轮选题分析。</pre>
        </section>
      </main>
    </div>
    <div id="toast" class="toast"></div>
    <script src="/app.js"></script>
  </body>
</html>
